main{padding:12px;max-width:760px;margin:auto}

button.d{background:#b3261e}

input,select,textarea{width:100%;padding:9px;border:1px solid var(--l);border-radius:8px;background:#fff}
textarea{min-height:76px}
label{display:block;font-size:13px;color:#4a5568;margin:10px 0 3px}
.card{background:#fff;border-radius:10px;padding:12px;margin:10px 0;border:1px solid var(--l)}

.chip.on{background:var(--n);color:#fff}
.b{font-size:12px;padding:2px 8px;border-radius:10px;background:#e3e8f0;color:#333}
.b.ok{background:#d6f5ee;color:#0a6b61}.b.ap{background:var(--n);color:#fff}

.th{width:70px;height:70px;object-fit:cover;border-radius:6px;margin:3px}
.sheet{display:none}
.sheet{width:285mm;background:#fff;color:#000;padding:4mm;font-size:11pt}
.sheet h1{font-size:18pt;margin:0 0 3mm}
.sheet table{width:100%;border-collapse:collapse;table-layout:fixed}
.sheet th,.sheet td{border:1px solid #808080;padding:2mm 2.5mm;vertical-align:middle;text-align:center}
.sheet th{background:#f2f2f2;width:9%}
.sheet td.body{text-align:left;vertical-align:top;height:118mm}
.sheet .txt{float:left;width:56%}.sheet .pics{float:right;width:43%}
.sheet,.sheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .ln{line-height:2;margin:0;font-size:10pt}.sheet .sy{display:flex}.sheet .sy span:first-child{white-space:nowrap}
.sheet mark{background:#ff0;color:inherit}
.sheet .tg{display:inline-block;background:#0033cc;color:#fff;font-size:9pt;padding:0 2mm;border-radius:2mm;font-weight:normal;line-height:1.5}

.sheet .pics img{width:auto;height:auto;max-width:100%;max-height:56mm;object-fit:fill;border:1px solid #999;display:block}.sheet .pics.t img{max-height:37mm}
.sheet .pics i{position:absolute;left:0;top:0;background:#0033cc;color:#fff;font-size:8.5pt;padding:0 2mm;font-style:normal}
.sheet td.l{text-align:left}
.red{color:var(--r)}.blue{color:var(--b)}
@page{size:A4 landscape;margin:6mm}
@media print{body{background:#fff}.ui{display:none!important}.sheet{display:block;padding:0}}
.pv .sheet{display:block;transform-origin:0 0}

function impEq(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let n=0;const add=(l,p)=>{l=String(l||'').trim();p=String(p||'').trim();if(!l)return;db.eq[l]=db.eq[l]||[];if(p&&!db.eq[l].includes(p)){db.eq[l].push(p);n++}};
  try{const d=JSON.parse(r.result);if(Array.isArray(d))d.forEach(x=>add(x.line||x['라인'],x.proc||x['공정']));else Object.keys(d).forEach(l=>Array.isArray(d[l])?d[l].forEach(p=>add(l,p)):0)}catch(e){r.result.split(/\r?\n/).forEach(t=>{const a=t.split(/[,\t]/);add(a[0],a[1])})}
  persist();render();alert('공정 '+n+'건을 추가했습니다')};r.readAsText(f)}

const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=d=>{let c=-1;for(let i=0;i<d.length;i++)c=crcT[(c^d[i])&255]^(c>>>8);return(c^-1)>>>0};
function zip(fs){const E=new TextEncoder();let off=0;const L=[],C=[];fs.forEach(([n,d])=>{const nb=E.encode(n),cr=crc(d),h=new DataView(new ArrayBuffer(30)),c=new DataView(new ArrayBuffer(46));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint32(14,cr,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nb.length,true);
  c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint32(16,cr,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);
  L.push(new Uint8Array(h.buffer),nb,d);C.push(new Uint8Array(c.buffer),nb);off+=30+nb.length+d.length});
  const cl=C.reduce((s,x)=>s+x.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,fs.length,true);e.setUint16(10,fs.length,true);e.setUint32(12,cl,true);e.setUint32(16,off,true);
  return new Blob([...L,...C,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.presentationml.presentation'})}
